name: Verify Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_asset_url:
        description: Public Windows ZIP to verify on Windows after the build checks
        required: false
        type: string
      release_asset_sha256:
        description: SHA-256 of the exact Windows ZIP
        required: false
        type: string

      mac_release_asset_url:
        description: Public Mac DMG for the same release
        required: false
        type: string
      mac_release_asset_sha256:
        description: SHA-256 of the exact Mac DMG
        required: false
        type: string

      windows_installer_url:
        description: Public complete Windows Setup EXE to install and launch
        required: false
        type: string
      windows_installer_sha256:
        description: SHA-256 of the exact Windows Setup EXE
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows-package-startup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS packaging tools
        run: choco install nsis --yes --no-progress
      - name: Verify desktop regression tests on Windows
        run: dotnet test tests/MailArchiver.Tests/MailArchiver.Tests.csproj -c Release --filter "FullyQualifiedName~LocalApp|FullyQualifiedName~UpstreamMailboxSyncServiceTests|FullyQualifiedName~MailTransportPolicyTests|FullyQualifiedName~CsvOnlyAccountSourceTests|FullyQualifiedName~CsvImportPipelineTests|FullyQualifiedName~MailConcurrencyCoordinatorTests|FullyQualifiedName~OutlookGraph|FullyQualifiedName~OutlookReceivingRoutingTests|FullyQualifiedName~MsaTokenManagerTests|FullyQualifiedName~MsaOAuthServiceTests|FullyQualifiedName~NetworkConnectionReuseTests" --logger "trx;LogFileName=windows.trx" --results-directory TestResults
      - name: Build the complete Windows package
        shell: pwsh
        run: ./windows-app/build-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/mailbox-package"
      - name: Launch the native app with isolated storage
        shell: pwsh
        run: |
          $env:MAIL_ASSISTANT_DATA_DIRECTORY = "$env:RUNNER_TEMP/mailbox-validation"
          $env:MAIL_ASSISTANT_PORT = '5139'
          $env:UpstreamMailboxSync__Enabled = 'true'
          $env:UpstreamMailboxSync__BearerToken = 'revoked-ci-sentinel'
          $setup = Get-ChildItem "$env:RUNNER_TEMP/MailAssistant-Windows-*-Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw 'Single-file installer is missing.' }
          $installed = Join-Path $env:RUNNER_TEMP 'mailbox-installed'
          $installation = Start-Process $setup.FullName -ArgumentList '/S', "/D=$installed" -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw 'Silent installation failed.' }
          if (-not (Test-Path "$installed/server/MailArchiver.exe")) { throw 'Installer omitted the server.' }
          if ((Get-FileHash "$installed/邮箱助手.exe").Hash -ne (Get-FileHash "$env:RUNNER_TEMP/mailbox-package/邮箱助手.exe").Hash) { throw 'Installed launcher differs from the package.' }
          $app = Start-Process "$installed/邮箱助手.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($app.HasExited) { throw 'Native app exited before its local server was ready.' }
              try {
                $page = Invoke-WebRequest 'http://127.0.0.1:5139/MailAccounts' -TimeoutSec 2
                if ($page.StatusCode -eq 200 -and $page.Content.Contains('data-initialization-status')) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Packaged Windows app did not become ready.' }
            $status = Invoke-RestMethod 'http://127.0.0.1:5139/MailAccounts/InitializationStatus'
            if ($status.enabled) { throw 'The isolated CI test must not call the live platform.' }
            if (-not (Test-Path "$env:MAIL_ASSISTANT_DATA_DIRECTORY/mail-archive.sqlite")) { throw 'Isolated SQLite database was not created.' }
            'PASS: Windows native launcher, packaged runtime, local HTTP, SQLite, initialization status.' | Out-File TestResults/windows-startup.txt
          } finally {
            if (-not $app.HasExited) { & taskkill /PID $app.Id /T /F }
          }
      - name: Verify the exact public Windows release ZIP
        if: inputs.release_asset_url != ''
        shell: pwsh
        env:
          RELEASE_ASSET_URL: ${{ inputs.release_asset_url }}
          RELEASE_ASSET_SHA256: ${{ inputs.release_asset_sha256 }}
          MAC_RELEASE_ASSET_URL: ${{ inputs.mac_release_asset_url }}
          MAC_RELEASE_ASSET_SHA256: ${{ inputs.mac_release_asset_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'release.zip'
          Invoke-WebRequest $env:RELEASE_ASSET_URL -OutFile $zip -TimeoutSec 180
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:RELEASE_ASSET_SHA256.ToLowerInvariant()) { throw 'Release ZIP checksum mismatch.' }
          if ($env:MAC_RELEASE_ASSET_URL) {
            $mac = Join-Path $env:RUNNER_TEMP 'mac-release.dmg'
            Invoke-WebRequest $env:MAC_RELEASE_ASSET_URL -OutFile $mac -TimeoutSec 180
            if ((Get-FileHash $mac -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:MAC_RELEASE_ASSET_SHA256.ToLowerInvariant()) { throw 'Mac public download checksum mismatch.' }
          }
          'PASS: supplied public release links downloaded and passed SHA-256 verification.' | Out-File TestResults/public-downloads.txt
          $extract = Join-Path $env:RUNNER_TEMP 'exact-release'
          Expand-Archive $zip -DestinationPath $extract
          $launcher = Get-ChildItem $extract -Recurse -Filter '邮箱助手.exe' | Select-Object -First 1
          if (-not $launcher) { throw 'UTF-8 launcher is missing.' }
          $settings = Get-Content (Join-Path $launcher.DirectoryName 'server/appsettings.Local.json') -Raw | ConvertFrom-Json
          if ($settings.UpstreamMailboxSync.BearerToken) { throw 'Release settings contain a plaintext token.' }
          $env:MAIL_ASSISTANT_DATA_DIRECTORY = Join-Path $env:RUNNER_TEMP 'exact-release-data'
          $env:MAIL_ASSISTANT_PORT = '5140'
          Remove-Item Env:UpstreamMailboxSync__Enabled -ErrorAction SilentlyContinue
          $app = Start-Process $launcher.FullName -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 180; $attempt++) {
              if ($app.HasExited) { throw 'Release native app exited before readiness.' }
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:5140/MailAccounts/InitializationStatus' -TimeoutSec 3
                if ($status.error -or $status.enabled) { throw 'CSV-only initialization failed.' }
                if ($status.ready -and $status.loaded -eq 0) { $ready = $true; break }
              } catch {
                if ($_.Exception.Message -like 'CSV-only initialization failed*') { throw }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Exact CSV-only release did not become ready.' }
            $report = Invoke-RestMethod 'http://127.0.0.1:5140/LocalMaintenance/PlatformReport'
            $expectedVersion = ([xml](Get-Content windows-app/MailAssistant.Windows.csproj)).Project.PropertyGroup.Version
            if ($report.appVersion -ne $expectedVersion -or $report.accountCount -ne 0) { throw 'Invalid release report.' }
            if (@($report.requests).Count -ne 0) { throw 'CSV-only release made platform requests.' }
            $report | ConvertTo-Json -Depth 10 | Out-File TestResults/exact-release-report.json
            "PASS: exact public ZIP SHA256=$hash; Unicode extraction, native Windows launcher, bundled runtime, fresh SQLite, CSV-only account source, no platform requests, safe request report." | Out-File TestResults/exact-release-startup.txt
          } finally {
            if (-not $app.HasExited) { & taskkill /PID $app.Id /T /F }
          }
      - name: Install and launch the exact public Windows Setup EXE
        if: inputs.windows_installer_url != ''
        shell: pwsh
        env:
          INSTALLER_URL: ${{ inputs.windows_installer_url }}
          INSTALLER_SHA256: ${{ inputs.windows_installer_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'exact-setup.exe'
          Invoke-WebRequest $env:INSTALLER_URL -OutFile $setup -TimeoutSec 180
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:INSTALLER_SHA256.ToLowerInvariant()) { throw 'Public installer checksum mismatch.' }
          $installed = Join-Path $env:RUNNER_TEMP 'exact-setup-installed'
          $installation = Start-Process $setup -ArgumentList '/S', "/D=$installed" -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw 'Public installer failed.' }
          $env:MAIL_ASSISTANT_DATA_DIRECTORY = Join-Path $env:RUNNER_TEMP 'exact-setup-data'
          $env:MAIL_ASSISTANT_PORT = '5141'
          $app = Start-Process "$installed/邮箱助手.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if ($app.HasExited) { throw 'Installed public app exited before readiness.' }
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:5141/DesktopUpdates/Health' -TimeoutSec 3
                $expected = ([xml](Get-Content windows-app/MailAssistant.Windows.csproj)).Project.PropertyGroup.Version
                if ($health.version -ne $expected) { throw 'Installed public app version mismatch.' }
                $ready = $true; break
              } catch {
                if ($_.Exception.Message -like '*version mismatch*') { throw }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Public installer app did not become ready.' }
            "PASS: exact public Setup EXE SHA-256 verified, silently installed, native launcher and backend started at v$expected." | Out-File TestResults/exact-installer-startup.txt
          } finally {
            if (-not $app.HasExited) { & taskkill /PID $app.Id /T /F }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-validation
          path: TestResults/
      - name: Prepare Windows delivery ZIP
        shell: pwsh
        run: |
          $version = ([xml](Get-Content windows-app/MailAssistant.Windows.csproj)).Project.PropertyGroup.Version
          $package = "$env:RUNNER_TEMP/MailAssistant-Windows-x64-v$version"
          Move-Item "$env:RUNNER_TEMP/mailbox-package" $package
          Compress-Archive -LiteralPath $package -DestinationPath "$env:RUNNER_TEMP/MailAssistant-Windows-x64-v$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            ${{ runner.temp }}/MailAssistant-Windows-x64-v*.zip
            ${{ runner.temp }}/MailAssistant-Windows-x64-v*-Setup.exe
          if-no-files-found: error
