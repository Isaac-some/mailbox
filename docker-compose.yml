name: kouzi-mail-archive

services:
  mailarchive-app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=MailArchiver;Username=mailuser;Password=${POSTGRES_PASSWORD:?set in .env}"
      Authentication__Username: "${MAILARCHIVE_ADMIN_USERNAME:?set in .env}"
      Authentication__Password: "${MAILARCHIVE_ADMIN_PASSWORD:?set in .env}"
      TimeZone__DisplayTimeZoneId: "Asia/Shanghai"
      MailSync__IntervalSeconds: "${MAILARCHIVE_SYNC_INTERVAL_SECONDS:-21600}"
      MailSync__LookbackDays: "${MAILARCHIVE_SYNC_LOOKBACK_DAYS:-30}"
      MailSync__SyncInboxOnly: "${MAILARCHIVE_SYNC_INBOX_ONLY:-true}"
      MailSync__MaxConcurrentSyncs: "${MAILARCHIVE_SYNC_MAX_CONCURRENT:-4}"
      MailSync__StartupStaggerSeconds: "${MAILARCHIVE_SYNC_STARTUP_STAGGER_SECONDS:-21600}"
      CredentialEncryption__KeyFilePath: "/run/secrets/credential_encryption_key"
    volumes:
      - ./.runtime/logs:/app/logs
      - ./.runtime/data-protection-keys:/app/DataProtection-Keys
    secrets:
      - credential_encryption_key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: MailArchiver
      POSTGRES_USER: mailuser
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
    volumes:
      - ./.runtime/postgres:/var/lib/postgresql/data
    networks:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailuser -d MailArchiver"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  postgres:

secrets:
  credential_encryption_key:
    file: ./secrets/credential_encryption_key
